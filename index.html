<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="robots" content="noindex">
<title>Cue Cards</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr) minmax(0, 0.7fr) minmax(0, 1.3fr);
    gap: 6px;
    height: 100dvh;
    padding: 6px;
    box-sizing: border-box;
  }
  button {
    font: 700 clamp(1.6rem, 8vw, 3.5rem)/1.1 system-ui, sans-serif;
    color: #fff;
    border: 4px solid #fff;
    border-radius: 14px;
    padding: 8px;
    touch-action: none;
  }
  #prevSlide, #nextSlide { background: #1b3a8a; }
  #repeat { grid-column: 1 / 3; background: #5a2d82; }
  #prevPoint, #nextPoint { background: #14602f; }
  button:active { filter: brightness(1.6); }
  /* Spoken by the screen reader; hidden from sight and from touch exploration. */
  #say { position: absolute; top: 0; left: 0; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
</style>
</head>
<body>
<main>
  <button id="prevSlide">Previous slide</button>
  <button id="nextSlide">Next slide</button>
  <button id="repeat">Repeat</button>
  <button id="prevPoint">Previous point</button>
  <button id="nextPoint">Next point</button>
</main>
<div id="say" aria-live="assertive" aria-atomic="true"></div>

<script>
// Notes come from talking-points-outline.md in this same folder: one "## " heading per slide,
// one "- " bullet per talking point. The pauses list and CUT SLIDE sections are skipped.
const OUTLINE = 'talking-points-outline.md';
const STORE = 'cue-cards-place';
const RATE = 2.25;   // speaking speed; 1 is the voice's normal pace
// Default: the page speaks each cue itself, for use with TalkBack off.
// Add ?voice=talkback to stay silent and let the screen reader speak instead.
const pageVoice = new URLSearchParams(location.search).get('voice') !== 'talkback';

let slides = [];
let s = 0;    // slide index
let p = -1;   // point index; -1 means "on the slide name, no point read yet"

function parse(md) {
  const out = [];
  let cur = null;
  for (const line of md.split(/\r?\n/)) {
    const h = line.match(/^## (.+)/);
    if (h) {
      const name = h[1].trim();
      const skip = /^All pauses at a glance/i.test(name) || /^CUT SLIDE/i.test(name);
      cur = skip ? null : { name: name.replace(/\s*\(([^)]*)\)\s*$/, '. $1'), points: [] };
      if (cur) out.push(cur);
      continue;
    }
    const b = line.match(/^- (.*)/);
    if (cur && b && b[1].trim()) cur.points.push(b[1].trim());
  }
  return out;
}

function say(text) {
  if (pageVoice && 'speechSynthesis' in window) {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = RATE;
    speechSynthesis.speak(u);
  }
  // Clear first so the same text is announced again on Repeat.
  const el = document.getElementById('say');
  el.textContent = '';
  setTimeout(() => { el.textContent = text; }, 60);
}

function save() {
  try { localStorage.setItem(STORE, JSON.stringify({ s, p })); } catch (e) {}
}

function slideIntro() {
  const n = slides[s].points.length;
  return 'Slide: ' + slides[s].name + '. ' + n + (n === 1 ? ' point.' : ' points.');
}

function nextPoint() {
  const sl = slides[s];
  if (p < sl.points.length - 1) { p++; say(sl.points[p]); }
  else if (s < slides.length - 1) { s++; p = -1; say(slideIntro()); }
  else say('End of notes.');
  save();
}

function prevPoint() {
  if (p > 0) { p--; say(slides[s].points[p]); }
  else if (p === 0) { p = -1; say(slideIntro()); }
  else if (s > 0) {
    s--; p = slides[s].points.length - 1;
    say('Back to slide: ' + slides[s].name + '. ' + (p >= 0 ? slides[s].points[p] : 'No points.'));
  }
  else say('Start of notes. ' + slideIntro());
  save();
}

function nextSlide() {
  if (s < slides.length - 1) { s++; p = -1; say(slideIntro()); }
  else say('Last slide. ' + slideIntro());
  save();
}

function prevSlide() {
  if (s > 0) { s--; p = -1; say(slideIntro()); }
  else { p = -1; say('First slide. ' + slideIntro()); }
  save();
}

function repeat() {
  const sl = slides[s];
  if (p < 0) say(slideIntro() + ' No point read yet.');
  else say('Slide: ' + sl.name + '. Point ' + (p + 1) + ' of ' + sl.points.length + '. ' + sl.points[p]);
}

const actions = { nextPoint, prevPoint, nextSlide, prevSlide, repeat };

fetch(OUTLINE, { cache: 'no-store' })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(md => {
    slides = parse(md);
    if (!slides.length) throw new Error('no slides');
    try {
      const saved = JSON.parse(localStorage.getItem(STORE));
      if (saved && slides[saved.s] && saved.p < slides[saved.s].points.length) { s = saved.s; p = saved.p; }
    } catch (e) {}
    const go = id => {
      // Keep the screen from locking mid-talk, where the browser allows it.
      if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {});
      actions[id]();
    };
    // Swipes work anywhere on screen: right/left = next/previous point, up/down = next/previous slide.
    let start = null, swiped = false;
    addEventListener('pointerdown', e => { start = { x: e.clientX, y: e.clientY }; swiped = false; });
    addEventListener('pointerup', e => {
      if (!start) return;
      const dx = e.clientX - start.x, dy = e.clientY - start.y;
      start = null;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 50) return;
      swiped = true;
      if (Math.abs(dx) > Math.abs(dy)) go(dx > 0 ? 'nextPoint' : 'prevPoint');
      else go(dy < 0 ? 'nextSlide' : 'prevSlide');
    });
    for (const id in actions) {
      document.getElementById(id).addEventListener('click', () => {
        if (swiped) { swiped = false; return; }   // the end of a swipe is not a button press
        go(id);
      });
    }
    say('Cue cards ready. ' + slides.length + ' slides. ' + slideIntro());
  })
  .catch(() => say('Could not load the notes file.'));
</script>
</body>
</html>
